# Test configuration using H2 in-memory database
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.generate-ddl=true
spring.jpa.show-sql=false
spring.jpa.hibernate.ddl-auto=create-drop
spring.main.allow-circular-references=true
server.error.include-message=always

# Virtual Threads (Java 21)
spring.threads.virtual.enabled=true

# JWT
jwt.secret=dGVzdC1zZWNyZXQta2V5LXRoYXQtaXMtbG9uZy1lbm91Z2gtZm9yLWhzNTEyLWFsZ29yaXRobS1yZXF1aXJlbWVudHM=
jwt.expiration=86400000
jwt.header=Authorization
jwt.prefix=Bearer

# Spring Mail (using GreenMail in tests)
spring.mail.host=localhost
spring.mail.port=3025

# Geolocation API
geo.api.url=https://api.findip.net
geo.api.key=test-api-key

# Redis (using embedded mock for tests)
spring.data.redis.host=localhost
spring.data.redis.port=6379
